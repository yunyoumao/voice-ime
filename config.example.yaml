# ============================================================
# 复制本文件为 config.yaml 后按需填写。
# config.yaml 含 API key，已被 .gitignore 忽略，不会进版本库。
# ============================================================

# 当前使用的识别引擎：local | soniox | aliyun | volcano
# - local   本地 SenseVoice：零成本、离线、隐私最好（整段识别，说完一句秒出）
# - soniox  逐字实时、中英日混合最强、最便宜（需 key，国内或需梯子）
# - aliyun  阿里百炼：国内稳定合规（需 DashScope key）
# - volcano 火山豆包：国内一流中文（需 appid+token）
engine: local

# 全局热键（不知道填什么就跑：.venv/bin/python scripts/probe_key.py 按键探测）
# 默认 <alt_r>＝右 Option：右手大拇指旁、平时不用、零破坏性误触，单手按住最顺
# 可选：<ctrl> 左 Ctrl（注意 Ctrl+点击=右键、Ctrl+方向=切桌面）
#       <cmd_r> 右 Cmd ／ <shift_r> 右 Shift
#       <f8> 功能键（需到「系统设置→键盘」开"将 F1–F12 作为标准功能键"）
# 组合键用 + 连：如 "<ctrl>+<space>"（⚠️ 勿用 <ctrl>/<cmd>+<space>，被输入法切换占用）
# ⚠️ Fn / 🌐 键无法使用：pynput 在 macOS 抓不到它（硬件键，不走系统键盘事件）
hotkey: "<alt_r>"

# 触发方式：hold(按住说话、松开停，默认) | toggle(按一下开始、再按一下停，适合说长段/总结)
hotkey_mode: hold

# 蓝牙遥控器接入(可选)：把遥控器在电脑上发出的某个键当语音触发，并可拦截其原本副作用。
# 例：CheerTok 这类遥控器在 PC 上只发 音量±/翻页±；翻页会滚屏，用音量键最合适。
remote:
  talk_hotkey: ""    # 例 "<media_volume_up>"：音量+键当"点按说话"(toggle 点开/再点停)
  menu_hotkey: ""    # 例 "<media_volume_down>"：点按开轮盘 → 触摸板移到某瓣"悬停"约1.2秒自动选中(见 mouse_menu.dwell_ms)
  suppress: true     # 拦截上述键原本副作用(如音量±不再改系统音量)；false=不拦截

# 录音参数（所有引擎统一 16k / 单声道 / PCM16）
audio:
  samplerate: 16000
  channels: 1
  blocksize: 1600        # 每帧采样数，1600 = 100ms @16kHz
  device: null           # 输入设备：null=系统默认；可填索引(整数)或名字片段
  gain: 1.0              # 软件增益倍数：远程桌面/RDP 麦偏小声时调大(试 4~8)，1.0=不变

# 上屏方式
output:
  mode: paste            # paste(剪贴板粘贴，推荐) | type(逐字模拟键盘)
  restore_clipboard: true   # 粘贴后恢复原剪贴板内容

# 实时浮窗（阶段 3 启用）
overlay:
  enabled: true

# 鼠标中键环形菜单（toggle）：按住中键弹菜单+开录 → 拖到某瓣松手=锁定该模式、菜单消失、
# 继续免持录音 → 再点一下中键=停止并上屏。松手在中心死区/环外=取消。
# 6 瓣：直接打字/语音润色/译中/译日/译英/总结。
mouse_menu:
  enabled: true
  button: none            # 鼠标拖选触发键：none(推荐,tap开的菜单用"悬停"确认,见 dwell_ms) | middle | right | left
  hotkey: "<ctrl_r>"      # 键盘开菜单键(右Ctrl,零冲突)。按住选→松开锁定免持→再点停。空=不用键盘
  theme: purple           # 配色主题：purple(淡紫) | green(墨绿) | cream(奶白)
  inner_radius: 55        # 中心死区半径(像素)：松开在此圈内=默认直接打字(raw)

  outer_radius: 160       # 外环半径(像素)
  dwell_ms: 1200          # 遥控器/tap 开菜单时光标"悬停"这么久自动选中(免点击→不抢焦点)。调大更不易误选
  glass: true             # 毛玻璃(逐像素alpha,仅Windows)：花瓣/浮窗后磨砂、其余透明。非Win/失败自动回退v3半透
  glass_tint_alpha: 78    # 磨砂暗蓝tint不透明度(0-255)：越大越暗(白字越清晰)、越小越透

# ---------------- 处理层：语音 → AI 工作流 ----------------
pipeline:
  default_mode: polish       # raw(直通) | polish(润色)  ［summary/translate/command 后续上线］
  prefix_routing: true       # 说"原文…"走直通；说"润色…"走润色；否则用 default_mode
  llm:
    provider: glm-cli        # glm-cli(复用你的 ask_glm.py，推荐) | openai
    timeout: 30              # 单次超时(秒)：超时即失败回退原文，不傻等。单次润色约1.2s，30s 足够长文翻译/总结
    max_concurrency: 1       # LLM 并发上限：智谱按 key 限并发，齐发会 429→串行(1)最稳；连说多句排队处理。配额高可调 2~3
    glm_cli:
      python: "python3"   # 系统 Python（不是本项目 .venv）
      script: "~/.claude/skills/glm-provider/ask_glm.py"
      model: "glm-4.7"
    openai:                  # provider=openai 时用（直连智谱需账户有余额；也可填其他厂商）
      base_url: "https://open.bigmodel.cn/api/paas/v4"
      api_key_env: "ZHIPU_API_KEY"
      model: "glm-4.5-air"

# 各模式输出去向：type(上屏)  ［file(写.md)/clipboard 后续上线］
sinks:
  raw: type
  polish: type
  translate_zh: type
  translate_ja: type
  translate_en: type
  summary: type

# ---------------- 各引擎独立配置 ----------------
engines:
  local:
    model_dir: "models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2025-09-09"
    vad_model: "models/silero_vad.onnx"
    num_threads: 2
    language: "auto"     # auto | zh | en | ja | ko | yue

  soniox:
    api_key: ""                       # 从 https://console.soniox.com 获取
    model: "stt-rt-preview"           # 实时模型名，以官方文档为准
    # Soniox 单模型自动多语言混合，无需指定语言

  aliyun:
    api_key: ""                       # DashScope API Key（DASHSCOPE_API_KEY）
    model: "qwen3-asr-flash-realtime" # 或 fun-asr-realtime
    region: "beijing"                 # beijing | singapore
    language_hints: ["zh", "en", "ja"]

  volcano:
    app_id: ""
    access_token: ""
    cluster: "volcengine_streaming_common"   # 以官方控制台为准
